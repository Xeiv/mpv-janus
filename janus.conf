# Janus Configuration
# Place this file in ~/.config/mpv/script-opts/janus.conf

# Master switch: whether history tracking is enabled (toggle anytime with Alt+h)
enabled=yes

# Where your history file is saved
# Supports mpv shortcuts like ~~/ (mpv config dir) or ~~state/
history_file=~~/janus_history.jsonl

# Maximum number of videos to keep when cleaning up history
max_history=5000

# Automatically clean up duplicate entries after this many log lines
compaction_threshold=10000

# Minimum seconds watched before saving to history (default: 5s)
# Ignores videos you open and quickly skip past
watch_threshold=5

# Seconds between progress updates while watching (default: 15s)
update_interval=15

# Save current playback position when pausing
save_on_pause=yes

# Whether to record online streams and URLs (e.g. YouTube)
log_urls=yes

# Format stream and video URL titles as "Author/Creator: Video Title (YYYY-MM-DD)"
format_url_titles=yes

# Query yt-dlp asynchronously for complete metadata (creator, title, upload date) when missing
fetch_url_metadata=yes

# Path to yt-dlp executable
ytdl_path=yt-dlp

# Semicolon or comma-separated list of paths or folders to ignore
# Videos inside these folders will not be tracked or prompted to resume
ignore_paths=

# Seconds before saved timestamp to resume from
resume_offset=0

# Prompt to resume playback when opening a previous video
ask_resume=yes

# Minimum saved position in seconds to show resume prompt (default: 10s)
resume_threshold=10

# Don't show resume prompt if saved position is within this many seconds from the end (default: 15s)
resume_end_threshold=15

# Don't show resume prompt if watched past this percentage (default: 95%)
# Great for skipping end credits on movies and anime
resume_end_percent=95

# Skip resume prompt when automatically advancing to the next file in a playlist (binge mode)
resume_skip_playlist=no

# Seconds to wait before auto-resuming (0 to disable, default: 10s)
resume_timeout=10

# Action to take when the countdown timer expires: "resume" or "beginning"
resume_timeout_action=resume

# Pause playback while asking to resume
resume_pause_on_prompt=yes

# UI mode: "auto" (detects uosc or falls back to vanilla OSD), "uosc", or "vanilla"
ui_mode=auto

# Number of videos displayed per page
page_size=20

# Hold Spacebar or Right Click to temporarily speed up (YouTube style)
speed_enabled=yes

# Playback speed multiplier while holding (default: 2.0)
speed_target=2.0

# Seconds to hold before speeding up activates (default: 0.3s)
speed_delay=0.3

# When opening mpv with no video playing (idle), pressing Spacebar resumes the last video
play_last_on_idle=yes

# Enable Ctrl+z (undo seek) and Ctrl+x (redo seek)
seek_history_enabled=yes

# Maximum number of seeks to remember in undo/redo history (default: 5)
seek_history_size=5
